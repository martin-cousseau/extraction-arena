name: extraction-arena-dev

# Hot-reload stack. Bind-mounts source; Vite HMR (frontend) and tsx watch (backend)
# pick up edits. After changing package.json / package-lock.json, either restart
# the service (entrypoint runs npm ci) or:
#   docker compose -f docker-compose.dev.yml up --watch
#
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml restart backend   # or frontend
#   docker compose -f docker-compose.dev.yml down

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: extraction-arena-backend-dev
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
      LLAMA_CLOUD_PROJECT_ID: ${LLAMA_CLOUD_PROJECT_ID:-}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - ./docker/dev-entrypoint.sh:/usr/local/bin/dev-entrypoint:ro
      - backend_node_modules:/app/node_modules
    entrypoint: ["/bin/sh", "/usr/local/bin/dev-entrypoint"]
    command: ["npm", "run", "dev"]
    init: true
    tty: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    develop:
      watch:
        - path: ./backend/package.json
          action: rebuild
        - path: ./backend/package-lock.json
          action: rebuild

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: extraction-arena-frontend-dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:3001
      VITE_ZAI_API_KEY: ${VITE_ZAI_API_KEY:-}
      VITE_OPENAI_API_KEY: ${VITE_OPENAI_API_KEY:-}
      VITE_XAI_API_KEY: ${VITE_XAI_API_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - ./docker/dev-entrypoint.sh:/usr/local/bin/dev-entrypoint:ro
      - frontend_node_modules:/app/node_modules
    entrypoint: ["/bin/sh", "/usr/local/bin/dev-entrypoint"]
    command: ["npm", "run", "dev"]
    init: true
    tty: true
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/package-lock.json
          action: rebuild

volumes:
  backend_node_modules:
  frontend_node_modules:
