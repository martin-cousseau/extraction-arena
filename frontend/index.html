<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compare vision models on first-responder rescue sheets. GLM-5V-Turbo, GPT-5.4 mini, and Grok 4.5 scored against a golden dataset." />
    <meta property="og:title" content="Extraction Arena" />
    <meta property="og:description" content="Compare vision models on first-responder rescue sheets." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Extraction Arena</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('boardui:theme');
          const theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
          if (stored !== 'light' && stored !== 'dark') {
            localStorage.setItem('boardui:theme', 'dark');
          }
        } catch {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <style>
      html { --font-inter: "Inter Variable", Inter, system-ui, sans-serif; --font-mono-source: "JetBrains Mono", ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
