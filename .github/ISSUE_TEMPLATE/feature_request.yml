name: Feature request
description: Propose a pipeline, metric, or UI change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? If this is a new extractor, see the README “Add a pipeline” section.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New extraction pipeline
        - Scoring / judge
        - Canonical schema
        - UI / BoardUI
        - Docs / OSS
        - Other
    validations:
      required: true
